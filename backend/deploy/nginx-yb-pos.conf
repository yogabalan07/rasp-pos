# YB Inventory & POS - nginx site
# Install to: /etc/nginx/sites-available/yb-pos
# Symlink to: /etc/nginx/sites-enabled/yb-pos
#
# Serves the built React SPA from /opt/yb-pos/dist and reverse-proxies the
# FastAPI edge service on 127.0.0.1:8000. Browsers must always talk to this
# single origin so the session cookie stays SameSite=Lax and path-scoped.

server {
    listen 80;
    server_name yb-pos.local 10.205.100.50;

    root /opt/yb-pos/dist;
    index index.html;

    client_max_body_size 5m;

    # The shell must never be cached, or clients keep a stale build forever.
    location = /index.html {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # Hashed build assets are immutable.
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API -> local SQLite-backed FastAPI service.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Stable per-terminal id used for idempotency and outbox attribution.
        proxy_set_header X-Device-Id $http_x_device_id;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # SPA fallback: every unknown route renders the React app.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Basic security headers (no auth implications).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
